# Builds the debug APK on every push and pull request, and runs the unit tests.
#
# The debug build is installable as-is (it is signed with the debug key and installs
# beside the release as "Magic Rear (dev)"). A release build is deliberately not made
# here: its signing key comes from the environment, and an unsigned APK will not install.
#
# Download the APK from the run's "Artifacts" section.

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already carries the Android SDK; only the packages this app
      # needs are installed. Done by hand rather than with setup-android because its
      # default "tools" package no longer exists in the current SDK repository.
      - name: Install Android SDK packages
        run: |
          set -e
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: magic-rear-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
