# Builds the debug APK on every push and pull request, and runs the unit tests.
#
# The debug build is installable as-is (it is signed with the debug key and installs
# beside the release as "Magic Rear (dev)"). A release build is deliberately not made
# here: its signing key comes from the environment, and an unsigned APK will not install.
#
# Download the APK from the run's "Artifacts" section.

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # compileSdk 36 and the aidl/build-tools binaries the app asks for. setup-android
      # accepts the licences, so sdkmanager can install unattended.
      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: magic-rear-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
